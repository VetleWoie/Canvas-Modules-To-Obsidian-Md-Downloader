[project]
name = "canvas-module-downloader"
version = "0.1.0"
description = "Download a Canvas LMS course's modules and convert Pages to Obsidian-flavored Markdown"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
canvas-module-downloader = "canvas_module_downloader:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
